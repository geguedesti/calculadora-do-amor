<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora do amor</title>
    <link rel="icon" href="ico.ico" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>

    <div id="content-box">
        <h1>Calculadora do amor</h1>
        <p>Entre com o seu nome e o do seu crush para ver a chance de relacionamento entre vocês:</p>

        <br>
        <label for="Seu-nome:">Seu nome: </label>
        <input type="text" id="Seu-nome" nome="Seu-nome"><br><br>

        <label for="Nome-do-seu-crush:">Nome do seu crush: </label>
        <input type="text" id="Nome-do-seu-crush" nome="Nome-do-seu-crush"><br><br>

        <button id="Calcule">Calcule</button>

        <h2 id="mensagem-de-resultado"></h2>
        <p id="resultado-de-porcentagem"></p>
    </div>
</body>
</html>
